<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Homelab</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      box-sizing: border-box; background: #091613; color: #d8e6e1; font-family: Roboto, "Google Sans", system-ui, sans-serif; }
    main { max-width: 360px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 24px; font-weight: 400; line-height: 32px; }
    p { margin: 0 0 28px; color: #a9bdb7; font-size: 16px; line-height: 24px; }
    button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #a1d0c5; color: #00382f;
      font: 500 14px/20px Roboto, system-ui, sans-serif; letter-spacing: .1px; }
    button:active { border-radius: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Can&rsquo;t reach your homelab</h1>
    <p>The dashboard at 192.168.0.2 didn&rsquo;t answer. Join your home Wi-Fi or turn on the VPN, then try again.</p>
    <button type="button" onclick="location.replace('http://192.168.0.2/')">Try again</button>
  </main>
  <script>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.SplashScreen&&Capacitor.Plugins.SplashScreen.hide();</script>
</body>
</html>
